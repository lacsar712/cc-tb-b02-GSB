{% extends "base.html" %}
{% block body %}
{% if can_write %}
<form method="post" action="{{ url_for('create') }}" data-swap="1">
  <h2>新开一轮审评</h2>
  <input name="lot" placeholder="批次" required />
  <input name="aroma" type="number" step="0.1" min="0" max="10" placeholder="香气" required />
  <input name="taste" type="number" step="0.1" min="0" max="10" placeholder="滋味" required />
  <input name="liquor" type="number" step="0.1" min="0" max="10" placeholder="汤色" required />
  <button>提交</button>
</form>
{% endif %}
<form method="get" action="{{ url_for('home') }}">
  <label>按审评台过滤（服务端）：
    <select name="table">
      <option value="">全部批次</option>
      {% for t in tables %}
      <option value="{{ t.name }}" {% if current_table == t.name %}selected{% endif %}>{{ t.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button>过滤</button>
  {% if current_table %}<a href="{{ url_for('home') }}">清除过滤</a>{% endif %}
</form>
{% if current_table %}<p>当前只显示「{{ current_table }}」在台批次的最新审评行。</p>{% endif %}
<table>
  <thead><tr><th>批次</th><th>加权分</th><th>结论</th><th>说明</th></tr></thead>
  <tbody id="rows">
    {% for row in rows %}{% include "_row.html" %}{% endfor %}
  </tbody>
</table>
{% endblock %}
