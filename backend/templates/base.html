<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>茶叶拼配审评台</title>
  <style>
    body { font-family: "Palatino Linotype", serif; background: #f6f1e7; color: #3f2e22; margin: 0; }
    header { background: #6b3e26; color: #fff; padding: 12px 20px; display: flex; gap: 16px; }
    header a { color: #f6e7c1; }
    main { max-width: 820px; margin: 20px auto; }
    table { width: 100%; background: #fffaf3; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #e6d3c0; text-align: left; }
    form { background: #fffaf3; padding: 12px; margin-bottom: 16px; }
    .pass { color: #166534; } .fail { color: #9f1239; }
    section { margin-bottom: 28px; }
    .station-bar { background: #efe2cd; padding: 8px 12px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .station-bar a { color: #6b3e26; text-decoration: none; padding: 2px 8px; border: 1px solid #c9b093; border-radius: 4px; background: #fffaf3; }
    .station-bar a.on { background: #6b3e26; color: #f6e7c1; }
    .station-bar .cur { color: #6b3e26; font-weight: bold; }
    .hint { color: #7a6250; font-size: 0.9em; }
    .readonly { color: #9f1239; font-weight: bold; }
    .empty { color: #7a6250; }
    label { display: inline-block; margin-right: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>茶叶拼配审评台</strong>
    {% if session.user %}
      <a href="{{ url_for('home') }}">总表</a>
      <a href="{{ url_for('transfer_page') }}">调拨台</a>
      <span>{{ session.user }}</span>
      <a href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    document.addEventListener("submit", async (event) => {
      const form = event.target;
      if (!form.dataset.swap) return;
      event.preventDefault();
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "HX-Request": "true" },
      });
      const html = await res.text();
      if (!res.ok) { alert(html); return; }
      document.querySelector(form.dataset.swap).insertAdjacentHTML("afterbegin", html);
      form.reset();
    });
  </script>
</body>
</html>
